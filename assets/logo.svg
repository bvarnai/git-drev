<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      .blue-element { fill: #3b87eb; }
      .blue-stroke { stroke: #3b87eb; stroke-width: 10; stroke-linecap: round; fill: none; }
      .orange-element { fill: #e5933a; }
      .orange-stroke { stroke: #e5933a; stroke-width: 10; stroke-linecap: round; fill: none; }
      .green-element { fill: #5cc68d; }
      .green-stroke { stroke: #5cc68d; stroke-width: 10; stroke-linecap: round; fill: none; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 64px;
        fill: #ffffff;
        text-anchor: middle;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 26px;
        fill: #788796;
        text-anchor: middle;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 34px;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- Dark Slate Background with subtle rounded corners -->
  <rect width="512" height="512" rx="36" fill="#1e2530" />

  <!-- Git Trunk (Vertical Blue Line & Nodes) -->
  <line x1="144" y1="78" x2="144" y2="290" class="blue-stroke" />
  <circle cx="144" cy="78" r="14" class="blue-element" />
  <circle cx="144" cy="206" r="14" class="blue-element" />
  <circle cx="144" cy="290" r="14" class="blue-element" />

  <!-- Upper Branch (Orange S-Curve to v2) -->
  <path d="M 144 206 C 180 206, 210 94, 274 94" class="orange-stroke" />
  <circle cx="274" cy="94" r="14" class="orange-element" />

  <!-- Lower Branch (Green S-Curve to v1) -->
  <path d="M 144 290 C 180 290, 210 214, 274 214" class="green-stroke" />
  <circle cx="274" cy="214" r="14" class="green-element" />

  <!-- Orange Document File Icon (v2) -->
  <g transform="translate(314, 62)">
    <!-- Document Body with Folded Top-Right Corner -->
    <path d="M 4 0 L 32 0 L 48 16 L 48 60 A 4 4 0 0 1 44 64 L 4 64 A 4 4 0 0 1 0 60 L 0 4 A 4 4 0 0 1 4 0 Z" class="orange-element" />
    <!-- Dog-Ear Fold Shadow / Flap -->
    <path d="M 32 0 L 32 12 A 4 4 0 0 0 36 16 L 48 16 Z" fill="#1e2530" opacity="0.95" />
  </g>
  <text x="376" y="94" class="badge-text orange-element">v2</text>

  <!-- Green Document File Icon (v1) -->
  <g transform="translate(314, 182)">
    <!-- Document Body with Folded Top-Right Corner -->
    <path d="M 4 0 L 32 0 L 48 16 L 48 60 A 4 4 0 0 1 44 64 L 4 64 A 4 4 0 0 1 0 60 L 0 4 A 4 4 0 0 1 4 0 Z" class="green-element" />
    <!-- Dog-Ear Fold Shadow / Flap -->
    <path d="M 32 0 L 32 12 A 4 4 0 0 0 36 16 L 48 16 Z" fill="#1e2530" opacity="0.95" />
  </g>
  <text x="376" y="214" class="badge-text green-element">v1</text>

  <!-- Typography -->
  <text x="256" y="394" class="title-text">git-drev</text>
  <text x="256" y="442" class="subtitle-text">directory revision manager</text>
</svg>
