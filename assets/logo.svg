<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cylindrical Button Radial Lighting -->
    <radialGradient id="btnRimShade" cx="48%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#2a303c" />
      <stop offset="65%" stop-color="#161a22" />
      <stop offset="100%" stop-color="#0a0d12" />
    </radialGradient>

    <!-- Recessed Stepped Rings -->
    <linearGradient id="grooveDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070a" />
      <stop offset="100%" stop-color="#141820" />
    </linearGradient>

    <!-- Cap Face Gradient -->
    <radialGradient id="capFace" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#202632" />
      <stop offset="72%" stop-color="#12161f" />
      <stop offset="100%" stop-color="#0b0e14" />
    </radialGradient>

    <!-- Neon Glow Stack -->
    <filter id="neonGlowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowOrange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .cyan-glow {
      stroke: #00d2ff;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#neonGlowCyan);
      opacity: 0.95;
    }
    .cyan-core {
      stroke: #a6f2ff;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#coreGlowCyan);
    }
    .orange-glow {
      stroke: #ff5722;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: url(#neonGlowOrange);
      opacity: 0.9;
    }
    .orange-core {
      stroke: #ffab91;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .txt-glow {
      font-family: ui-monospace, SFMono-Regular, "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 2px;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.65));
    }
    .txt-dim {
      fill: #00d2ff;
    }
  </style>

  <!-- Base Outer Shell -->
  <circle cx="256" cy="256" r="248" fill="url(#btnRimShade)" />
  <circle cx="256" cy="256" r="247" fill="none" stroke="#363f4e" stroke-width="2" opacity="0.4" />

  <!-- Recessed Groove -->
  <circle cx="256" cy="256" r="226" fill="url(#grooveDark)" stroke="#07090c" stroke-width="4" />

  <!-- Inner Raised Bezel Face -->
  <circle cx="256" cy="256" r="214" fill="url(#capFace)" stroke="#2b3342" stroke-width="2.5" />

  <!-- Subtle Texture Rings -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#1c222c" stroke-width="1.5" />
  <circle cx="256" cy="256" r="175" fill="none" stroke="#161b24" stroke-width="1" />

  <!-- Central Schematic: Git Revision Branching + Remote Directory Disks -->
  <g transform="translate(0, -18)">
    <!-- Top Storage Disk / Directory Platter (Upper Layer) -->
    <ellipse cx="256" cy="148" rx="84" ry="24" class="cyan-glow" stroke-width="6" />
    <ellipse cx="256" cy="148" rx="84" ry="24" class="cyan-core" stroke-width="2" />

    <!-- Storage Disk Sides (Cylindrical Body) -->
    <path d="M 172 148 V 172 C 172 186, 340 186, 340 172 V 148" class="cyan-glow" stroke-width="5" />
    <path d="M 172 148 V 172 C 172 186, 340 186, 340 172 V 148" class="cyan-core" stroke-width="1.8" />

    <!-- Second Storage Disk (Lower Revision Layer) -->
    <path d="M 172 180 V 204 C 172 218, 340 218, 340 204 V 180" class="cyan-glow" stroke-width="5" />
    <path d="M 172 180 V 204 C 172 218, 340 218, 340 204 V 180" class="cyan-core" stroke-width="1.8" />

    <!-- Git Branch Line / Commit Node (Orange Accent) -->
    <!-- Base Commit Node -->
    <circle cx="160" cy="265" r="14" class="orange-glow" stroke-width="4" fill="#12161f" />
    <circle cx="160" cy="265" r="6" class="orange-core" fill="#ff5722" />

    <!-- Branch Path linking to Remote Storage -->
    <path d="M 160 265 C 160 230, 215 220, 240 214" class="orange-glow" stroke-width="4.5" />
    <path d="M 160 265 C 160 230, 215 220, 240 214" class="orange-core" stroke-width="1.8" />

    <!-- Sync Delta Connection Nodes -->
    <circle cx="352" cy="265" r="14" class="cyan-glow" stroke-width="4" fill="#12161f" />
    <circle cx="352" cy="265" r="6" class="cyan-core" fill="#00d2ff" />

    <path d="M 352 265 C 352 230, 297 220, 272 214" class="cyan-glow" stroke-width="4.5" />
    <path d="M 352 265 C 352 230, 297 220, 272 214" class="cyan-core" stroke-width="1.8" />

    <!-- Central Sync Arrow Arc -->
    <path d="M 210 265 C 235 285, 277 285, 302 265" class="cyan-glow" stroke-width="4" />
    <path d="M 210 265 C 235 285, 277 285, 302 265" class="cyan-core" stroke-width="1.5" />
  </g>

  <!-- Typography -->
  <text x="256" y="388" class="txt-glow">git-<tspan class="txt-dim">drev</tspan></text>
</svg>
